name: android_build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.27.4', channel: stable }
      - name: Generate fixtures (deterministic, synthetic)
        run: |
          python3 tools/make_fixture.py
          python3 tools/make_leveldb_fixture.py
      - name: Generate Android scaffold + overlay
        run: bash tools/apply_android_overlay.sh
      - run: flutter pub get
      - run: flutter analyze
      - name: Run Flutter tests
        run: |
          set -o pipefail
          flutter test --reporter expanded | tee test_report.txt
      - run: flutter build apk --debug
      - name: Checksum and build info
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk | tee app-debug.apk.sha256
          flutter --version > "$GITHUB_WORKSPACE/build_info.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mc-manger-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
            test_report.txt
            build_info.txt
