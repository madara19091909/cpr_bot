
name: Build MC Manger APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MC_Manger_Updated.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip MC_Manger_Updated.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable

      - name: Generate fixtures
        working-directory: source/mc_manger
        run: |
          python3 tools/make_fixture.py
          python3 tools/make_leveldb_fixture.py

      - name: Prepare Android project
        working-directory: source/mc_manger
        run: bash tools/apply_android_overlay.sh

      - name: Install dependencies
        working-directory: source/mc_manger
        run: flutter pub get

      - name: Analyze code
        working-directory: source/mc_manger
        run: flutter analyze

      - name: Run tests
        working-directory: source/mc_manger
        run: flutter test --reporter expanded

      - name: Build APK
        working-directory: source/mc_manger
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MC-Manger-APK
          path: source/mc_manger/build/app/outputs/flutter-apk/app-debug.apk
